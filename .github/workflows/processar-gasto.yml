name: Processar Gasto

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  registrar-despesa:
    if: contains(github.event.issue.labels.*.name, 'gasto')
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Registrar Gasto
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/registrar.py

      - name: Commitar alterações no banco de dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/gastos.json
          git commit -m "feat(financas): novo gasto de R$ ${{ env.NOVO_VALOR }} [${{ env.GASTO_CAT }}]" || exit 0
          git push

      - name: Responder e Fechar Issue
        uses: actions/github-script@v7
        env:
          NOVO_VALOR: ${{ env.NOVO_VALOR }}
          NOVO_TOTAL: ${{ env.NOVO_TOTAL }}
          MES_ATUAL: ${{ env.MES_ATUAL }}
          GASTO_DESC: ${{ env.GASTO_DESC }}
          GASTO_CAT: ${{ env.GASTO_CAT }}
        with:
          script: |
            const comment = `### ✅ Gasto Registrado com Sucesso!
            
| Detalhe | Informação |
| :--- | :--- |
| **Descrição** | ${process.env.GASTO_DESC} |
| **Categoria** | ${process.env.GASTO_CAT} |
| **Valor Registrado** | **R$ ${process.env.NOVO_VALOR}** |
| **Total do Mês (${process.env.MES_ATUAL})** | 💳 **R$ ${process.env.NOVO_TOTAL}** |

> *Esta issue foi processada e fechada automaticamente pela GitHub Action.*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed'
            });
